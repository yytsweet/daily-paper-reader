subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: quantization
      description: 收集大语言模型和多模态模型的量化技术论文
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: large language model quantization
          keyword_cn: 大语言模型量化
          query: >-
            Research on quantization methods for large language models, including reduced precision weights and
            activations.
        - keyword: multimodal model quantization
          keyword_cn: 多模态模型量化
          query: Techniques for quantizing multimodal models to reduce memory and computation.
        - keyword: post-training quantization
          keyword_cn: 训练后量化
          query: Post-training quantization approaches for compressing large language models without retraining.
        - keyword: quantized inference
          keyword_cn: 量化推理
          query: Quantized inference systems and kernels for large language and multimodal models.
        - keyword: quantization calibration
          keyword_cn: 量化校准
          query: Calibration methods for accurate post-training quantization of large models.
        - keyword: vision language model quantization
          keyword_cn: 视觉语言模型量化
          query: Quantization techniques for vision-language models and multimodal architectures.
      intent_queries:
        - query: >-
            Find research papers about quantization methods that compress large language models and multimodal models
            while preserving accuracy.
          query_cn: 查找关于在保持准确率的同时压缩大语言模型和多模态模型的量化方法的研究论文。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Search for studies on post training quantization, quantization aware training, and low bit quantization for
            large language and vision language models.
          query_cn: 搜索关于大语言模型和视觉语言模型的训练后量化、量化感知训练和低位量化的研究。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Identify quantization techniques for efficient inference, memory reduction, and deployment of large language
            models and multimodal models.
          query_cn: 识别用于大语言模型和多模态模型高效推理、内存降低和部署的量化技术。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Collect papers on calibration, weight quantization, activation quantization, and mixed precision methods for
            large models.
          query_cn: 收集关于大模型校准、权重量化、激活量化和混合精度方法的论文。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-11-09T08:04:09.851Z'
